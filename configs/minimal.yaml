objective: MLM
results_dir: results/minimal
template_file: data/templates_minimal.yaml
target_words: data/professions_minimal.json
random_seed: 42
batch_size: 8
pretrained_model: bert-base-uncased
epochs: 2
iterations: 1
minP: [0.05, 0.1]
maxP: [0.8, 0.9]
mask_prob: 0.15
masking_strategy: attribute
eval_strategy: target
target_r_value: 0.1
max_retries: 2
learning_rate: 1e-5
pooling: mean
add_wiki_data: True